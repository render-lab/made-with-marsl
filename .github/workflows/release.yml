name: Build and release images
on:
  push:
    paths: ['packages/**']
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full SHA of the original merged release commit to retry
        required: true
        type: string
permissions: {}
jobs:
  plan:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          RETRY_COMMIT: ${{ inputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RETRY_COMMIT" ]; then
            [[ "$RETRY_COMMIT" =~ ^[a-f0-9]{40}$ ]]
            git merge-base --is-ancestor "$RETRY_COMMIT" "$AFTER"
            AFTER="$RETRY_COMMIT"
            BEFORE="$(git rev-parse "$AFTER^")"
            # Keep the current trusted validator but inspect the original release files.
            git restore --source="$AFTER" --worktree -- packages/
          fi
          node scripts/plan.mjs "$BEFORE" "$AFTER"
          printf 'commit=%s\n' "$AFTER" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          buildkitd-flags: ''
      - name: Build without publishing credentials
        env:
          RELEASE_PATH: ${{ matrix.path }}
          IMAGE: ${{ matrix.image }}
          REVIEW_HASH: ${{ matrix.reviewHash }}
        run: docker buildx build --platform linux/amd64 --provenance=false --label "dev.marsl.bundle-digest=$REVIEW_HASH" --file "$RELEASE_PATH/Dockerfile" --tag "$IMAGE" --output type=oci,dest=/tmp/image.tar "$RELEASE_PATH/src"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.id }}
          path: /tmp/image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: release-${{ matrix.id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      # This job never checks out or executes project code.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-${{ matrix.id }}
          path: /tmp/image
      - name: Install registry transport
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Publish image and record its digest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: render-lab/made-with-marsl
          IMAGE: ${{ matrix.image }}
          RELEASE_ID: ${{ matrix.id }}
          SOURCE_HASH: ${{ matrix.sourceHash }}
          REVIEW_HASH: ${{ matrix.reviewHash }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="$(mktemp)"
          printf '{}\n' > "$REGISTRY_AUTH_FILE"
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$ACTOR" --password-stdin ghcr.io
          test "$(gh api "repos/$GH_REPO" --jq .visibility)" = internal
          skopeo inspect oci-archive:/tmp/image/image.tar > /tmp/image-info.json
          jq -e --arg id "$RELEASE_ID" --arg source "$SOURCE_HASH" --arg review "$REVIEW_HASH" '.Labels["dev.marsl.release-id"] == $id and .Labels["dev.marsl.source-digest"] == $source and .Labels["dev.marsl.bundle-digest"] == $review and .Labels["org.opencontainers.image.source"] == "https://github.com/render-lab/made-with-marsl"' /tmp/image-info.json
          PACKAGE="${IMAGE#ghcr.io/render-lab/}"
          PACKAGE="${PACKAGE%:*}"
          TAG="${IMAGE##*:}"
          EXISTS=false
          if gh api "orgs/render-lab/packages/container/$PACKAGE" > /tmp/package.json 2>/tmp/package-error; then
            jq -e '.visibility == "internal" or .visibility == "private"' /tmp/package.json
            gh api --paginate "orgs/render-lab/packages/container/$PACKAGE/versions?per_page=100" --jq '.[].metadata.container.tags[]' > /tmp/tags
            if grep -Fxq "$TAG" /tmp/tags; then EXISTS=true; fi
          elif ! grep -q 'HTTP 404' /tmp/package-error; then
            cat /tmp/package-error; exit 1
          fi
          # Never overwrite an existing version. A retry reuses its original digest.
          if [ "$EXISTS" = true ]; then
            skopeo inspect "docker://$IMAGE" > /tmp/existing.json
            jq -e --arg id "$RELEASE_ID" --arg source "$SOURCE_HASH" --arg review "$REVIEW_HASH" '.Labels["dev.marsl.release-id"] == $id and .Labels["dev.marsl.source-digest"] == $source and .Labels["dev.marsl.bundle-digest"] == $review' /tmp/existing.json
            jq -r .Digest /tmp/existing.json > /tmp/digest
          else
            skopeo copy --all --digestfile /tmp/digest oci-archive:/tmp/image/image.tar "docker://$IMAGE"
          fi
          VISIBILITY="$(gh api "orgs/render-lab/packages/container/$PACKAGE" --jq .visibility)"
          test "$VISIBILITY" = internal || test "$VISIBILITY" = private
          DIGEST="$(cat /tmp/digest)"
          jq -n --arg releaseId "$RELEASE_ID" --arg sourceHash "$SOURCE_HASH" --arg reviewHash "$REVIEW_HASH" --arg image "$IMAGE" --arg digest "$DIGEST" '{releaseId:$releaseId,sourceHash:$sourceHash,reviewHash:$reviewHash,image:$image,digest:$digest}' > /tmp/evidence.json
          if gh release view "marsl-$RELEASE_ID" --json body --jq .body > /tmp/old-evidence.json 2>/dev/null; then
            diff <(jq -S . /tmp/old-evidence.json) <(jq -S . /tmp/evidence.json)
          else
            gh release create "marsl-$RELEASE_ID" --target "$COMMIT" --title "$PACKAGE" --notes-file /tmp/evidence.json
          fi
          printf '### Published image\n\n`%s@%s`\n' "${IMAGE%:*}" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
